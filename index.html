<title>The Peer</title>
<style>
  :root {
    --bg: #04050a; --glass: rgba(12, 16, 28, .72); --glass2: rgba(20, 26, 44, .78);

  .safety { font: 22px/1.6 var(--mono); letter-spacing: 1px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 12px; text-align: center; color: var(--cyan);

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<script>
'use strict';
/*
 * The Peer: serverless, end-to-end encrypted chat over WebRTC.
 *
 * Finding each other: every pair of friends shares a random 128-bit room
 * secret. It starts life in the invite link (in the #fragment, which browsers
 * never send to the web host). Both devices derive a topic name and an
 * AES-GCM key from it, and use free public MQTT relays only to say "I'm here"
 * and to swap WebRTC connection details. Relays see only encrypted blobs on a
 * random-looking topic. Chat messages never touch them: they flow directly
 * between the two devices.
 *
 * Inside the direct link, on top of WebRTC's own encryption: each device has a
 * long-term identity key (ECDSA P-256, non-extractable, kept in IndexedDB).
 * Each session does a fresh signed ECDH exchange, derives one AES-256-GCM key
 * per direction with HKDF, and numbers every message so replays are rejected.
 * A saved contact must always present the same identity key, and users can
 * compare a safety number derived from both identity keys.
 */

const $ = (s) => document.querySelector(s);
const enc = new TextEncoder();
const dec = new TextDecoder();
const STUN_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' }];
const DEFAULT_RELAYS = [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://test.mosquitto.org:8081/mqtt',
];
// Developers can point at their own relay for testing: localStorage['thepeer.relays'] = '["ws://localhost:8888"]'
const RELAYS = JSON.parse(localStorage.getItem('thepeer.relays') || 'null') || DEFAULT_RELAYS;
const INVITE_TTL = 24 * 3600 * 1000; // invite links expire after 24 hours
const PRESENCE_EVERY = 8000;
const ONLINE_WINDOW = 20000;

// German if the device prefers German, English otherwise; the user's own choice wins.
function detectLang() {
  const saved = localStorage.getItem('thepeer.lang');
  if (STRINGS[saved]) return saved;
  for (const l of navigator.languages || [navigator.language]) {
    const code = String(l).slice(0, 2).toLowerCase();
    if (STRINGS[code]) return code;
  }
  return 'en';
}
let lang = detectLang();

}

// ---------- small helpers ----------
const b64u = {
  enc(bytes) {
    let s = '';
    for (const b of bytes) s += String.fromCharCode(b);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  },
  dec(str) {
    const s = atob(str.replace(/-/g, '+').replace(/_/g, '/'));
    return Uint8Array.from(s, (c) => c.charCodeAt(0));
  },
};
const hex = (bytes) => Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
const randomBytes = (n) => crypto.getRandomValues(new Uint8Array(n));
function concat(...arrs) {
  const out = new Uint8Array(arrs.reduce((n, a) => n + a.length, 0));
  let i = 0;
  for (const a of arrs) { out.set(a, i); i += a.length; }
  return out;
}
function compareBytes(a, b) {
  for (let i = 0; i < Math.min(a.length, b.length); i++) if (a[i] !== b[i]) return a[i] - b[i];
  return a.length - b.length;
}
const sha256 = async (data) => new Uint8Array(await crypto.subtle.digest('SHA-256', data));
let currentView = null;
function show(id) {
  currentView = id;
  document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === id));
}
async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); }

}
const cleanName = (n) => String(n || '').trim().slice(0, 40) || t('friend');

// ---------- tiny IndexedDB key-value store ----------
let dbPromise;
function db() {
  dbPromise ??= new Promise((res, rej) => {
    const r = indexedDB.open('peerchat', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbPromise;
}
async function kvGet(key) {
  const d = await db();
  return new Promise((res, rej) => {
    const r = d.transaction('kv').objectStore('kv').get(key);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function kvSet(key, val) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction('kv', 'readwrite');
    t.objectStore('kv').put(val, key);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}

// ---------- identity & saved state ----------
let me = null; // { name, keys: CryptoKeyPair, pubRaw: Uint8Array }
let contacts = {}; // identity id -> { name, verified, secret, lastSeen }
let invites = {}; // secret -> { created }            (links I sent)
let joins = {}; // secret -> { from, created }        (links I opened)

async function loadState() {
  contacts = (await kvGet('contacts')) || {};
  // Contacts from the old code-based version had no room secret; they can't reconnect.
  for (const [id, c] of Object.entries(contacts)) if (!c.secret) delete contacts[id];
  const now = Date.now();
  invites = Object.fromEntries(Object.entries((await kvGet('invites')) || {}).filter(([, v]) => now - v.created < INVITE_TTL));
  joins = Object.fromEntries(Object.entries((await kvGet('joins')) || {}).filter(([, v]) => now - v.created < INVITE_TTL));
  const saved = await kvGet('identity');
  if (saved) me = { ...saved, pubRaw: new Uint8Array(await crypto.subtle.exportKey('raw', saved.keys.publicKey)) };
}
const saveContacts = () => kvSet('contacts', contacts);
const isExpired = (v) => Date.now() - v.created >= INVITE_TTL;
function expireInvites() {
  let changed = false;
  for (const [store, save] of [[invites, saveInvites], [joins, saveJoins]]) {
    const gone = Object.keys(store).filter((k) => isExpired(store[k]));
    for (const k of gone) {
      delete store[k];
      const room = roomsBySecret.get(k);
      if (room) {
        if (call?.room === room && !session) connectionLost(call, t('expired'));
        room.close();
      }
    }
    if (gone.length) { save(); changed = true; }
  }
  if (changed && currentView === 'v-home') renderContacts();
}
const saveInvites = () => kvSet('invites', invites);
const saveJoins = () => kvSet('joins', joins);

async function createIdentity(name) {
  // The private key is non-extractable: page scripts can use it but never read it out.
  const keys = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign', 'verify']);
  await kvSet('identity', { name, keys });
  me = { name, keys, pubRaw: new Uint8Array(await crypto.subtle.exportKey('raw', keys.publicKey)) };
}

// ---------- minimal MQTT 3.1.1 client over WebSocket (QoS 0 only) ----------
function mqttString(s) { const b = enc.encode(s); return concat(new Uint8Array([b.length >> 8, b.length & 255]), b); }
function mqttPacket(first, body) {
  const len = [];
  let n = body.length;
  do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; len.push(d); } while (n > 0);
  return concat(new Uint8Array([first, ...len]), body);
}

class MqttConnection {
  constructor(url, onMessage, onChange) {
    this.url = url; this.onMessage = onMessage; this.onChange = onChange;
    this.topics = new Set(); this.up = false; this.packetId = 1; this.backoff = 1000;
    this.connect();
  }
  connect() {
    let ws;
    try { ws = new WebSocket(this.url, ['mqtt']); } catch { return this.retry(); }
    this.ws = ws; this.buf = new Uint8Array(0);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => {
      const clientId = 'tp' + hex(randomBytes(10));
      const body = concat(mqttString('MQTT'), new Uint8Array([4, 0x02, 0, 60]), mqttString(clientId));
      ws.send(mqttPacket(0x10, body));
    };
    ws.onmessage = (e) => this.feed(new Uint8Array(e.data));
    ws.onclose = ws.onerror = () => {
      if (this.ws !== ws) return;
      this.ws = null;
      clearInterval(this.pinger);
      if (this.up) { this.up = false; this.onChange(); }
      this.retry();
    };
  }
  retry() {
    setTimeout(() => this.connect(), this.backoff);
    this.backoff = Math.min(this.backoff * 2, 30000);
  }
  feed(chunk) {
    this.buf = concat(this.buf, chunk);
    for (;;) {
      if (this.buf.length < 2) return;
      let len = 0, mult = 1, i = 1, byte;
      do {
        if (i >= this.buf.length) return;
        byte = this.buf[i++]; len += (byte & 127) * mult; mult *= 128;
      } while (byte & 128);
      if (this.buf.length < i + len) return;
      const type = this.buf[0] >> 4, qos = (this.buf[0] >> 1) & 3;
      const body = this.buf.subarray(i, i + len);
      this.buf = this.buf.slice(i + len);
      if (type === 2 && body[1] === 0) { // CONNACK accepted
        this.up = true; this.backoff = 1000;
        for (const t of this.topics) this.sendSubscribe(t);
        this.pinger = setInterval(() => this.send(new Uint8Array([0xc0, 0])), 30000);
        this.onChange();
      } else if (type === 3) { // PUBLISH
        const tlen = (body[0] << 8) | body[1];
        const topic = dec.decode(body.subarray(2, 2 + tlen));
        this.onMessage(topic, body.subarray(2 + tlen + (qos ? 2 : 0)));
      }
    }
  }
  send(bytes) { if (this.ws?.readyState === 1) this.ws.send(bytes); }
  nextId() { this.packetId = (this.packetId % 65535) + 1; return new Uint8Array([this.packetId >> 8, this.packetId & 255]); }
  sendSubscribe(topic) { if (this.up) this.send(mqttPacket(0x82, concat(this.nextId(), mqttString(topic), new Uint8Array([0])))); }
  subscribe(topic) { if (!this.topics.has(topic)) { this.topics.add(topic); this.sendSubscribe(topic); } }
  unsubscribe(topic) {
    if (this.topics.delete(topic) && this.up) this.send(mqttPacket(0xa2, concat(this.nextId(), mqttString(topic))));
  }
  publish(topic, payload) { if (this.up) this.send(mqttPacket(0x30, concat(mqttString(topic), payload))); }
}

// The same message goes through every relay; whichever arrives first wins.
const relay = {
  conns: [], rooms: new Map(), // topic -> Room
  start() { this.conns = RELAYS.map((u) => new MqttConnection(u, (t, p) => this.rooms.get(t)?.receive(p), updateNetStatus)); },
  upCount() { return this.conns.filter((c) => c.up).length; },
  add(room) { this.rooms.set(room.topic, room); this.conns.forEach((c) => c.subscribe(room.topic)); },
  remove(room) { this.rooms.delete(room.topic); this.conns.forEach((c) => c.unsubscribe(room.topic)); },
  publish(topic, payload) { this.conns.forEach((c) => c.publish(topic, payload)); },
};

// ---------- rooms: one per friend (or pending invite) ----------
const MY_PEER = hex(randomBytes(8)); // changes on every app launch
const roomsBySecret = new Map();

class Room {
  // kind: 'contact' (saved friend), 'invite' (link I sent), 'join' (link I opened)
  static async open(secret, kind, extra = {}) {
    if (roomsBySecret.has(secret)) return Object.assign(roomsBySecret.get(secret), { kind }, extra);
    const base = await crypto.subtle.importKey('raw', b64u.dec(secret), 'HKDF', false, ['deriveBits', 'deriveKey']);
    const params = (info) => ({ name: 'HKDF', hash: 'SHA-256', salt: enc.encode('thepeer-room-v1'), info: enc.encode(info) });
    const topicBits = new Uint8Array(await crypto.subtle.deriveBits(params('topic'), base, 128));
    const key = await crypto.subtle.deriveKey(params('key'), base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    const room = Object.assign(new Room(), { secret, kind, key, topic: 'thepeer/v1/' + hex(topicBits), lastSeen: 0, seen: new Set() }, extra);
    roomsBySecret.set(secret, room);
    relay.add(room);
    return room;
  }
  close() { relay.remove(this); roomsBySecret.delete(this.secret); }
  label() {
    if (this.kind === 'contact') return contacts[this.contactId]?.name || t('friend');
    if (this.kind === 'join') return this.from || t('friend');
    return t('newContact');
  }
  online() { return Date.now() - this.lastSeen < ONLINE_WINDOW; }
  async send(msg) {
    const iv = randomBytes(12);
    const body = enc.encode(JSON.stringify({ ...msg, from: MY_PEER, id: hex(randomBytes(8)) }));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, this.key, body));
    relay.publish(this.topic, concat(iv, ct));
  }
  async receive(payload) {
    let msg;
    try {
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: payload.subarray(0, 12) }, this.key, payload.subarray(12));
      msg = JSON.parse(dec.decode(pt));
    } catch { return; } // not for us, or tampered with
    if (msg.from === MY_PEER || this.seen.has(msg.id)) return;
    this.seen.add(msg.id);
    if (this.seen.size > 500) this.seen = new Set([...this.seen].slice(-250));
    if (msg.to && msg.to !== MY_PEER) return;
    const wasOnline = this.online();
    this.lastSeen = Date.now();
    if (!wasOnline) refreshPresence();
    onRoomMessage(this, msg).catch((e) => console.error(e));
  }
}

// ---------- connecting two devices ----------
// call: { room, role: 'dialer' | 'offerer', peer, pc, knocker, timer }
let call = null;
let session = null;

async function onRoomMessage(room, m) {
  if (m.t === 'knock') {
    if (room.kind === 'invite' && (!invites[room.secret] || isExpired(invites[room.secret]))) return expireInvites();
    if (call?.room === room) {
      // Both sides dialed at once: the lower id makes the offer.
      if (call.role === 'dialer' && !call.pc && MY_PEER < m.from) startOffer(room, m.from);
      return;
    }
    if (call) return; // busy in another chat; they keep knocking and connect once we're free
    startOffer(room, m.from);
  } else if (m.t === 'offer') {
    if (call?.room === room && call.role === 'dialer' && !call.pc) answerOffer(call, m);
  } else if (m.t === 'answer') {
    const c = call;
    if (c?.room === room && c.role === 'offerer' && c.peer === m.from && c.pc?.signalingState === 'have-local-offer') {
      await c.pc.setRemoteDescription({ type: 'answer', sdp: m.sdp });
    }
  }
}

function makePeerConnection(c) {
  const pc = new RTCPeerConnection({ iceServers: STUN_SERVERS });
  pc.onconnectionstatechange = () => {
    if (call === c && ['failed', 'closed'].includes(pc.connectionState)) connectionLost(c);
  };
  return pc;
}
function waitForIce(pc) {
  // Gather all network candidates up front so one message is enough.
  return new Promise((res) => {
    if (pc.iceGatheringState === 'complete') return res();
    const timer = setTimeout(res, 4000);
    pc.addEventListener('icegatheringstatechange', () => {
      if (pc.iceGatheringState === 'complete') { clearTimeout(timer); res(); }
    });
  });
}
function watchChannel(c, ch) {
  ch.onopen = () => { if (call === c) attachChannel(c, ch); };
}

// I want to talk to whoever is in this room: keep knocking until they answer.
function dial(room) {
  endCall();
  const c = call = { room, role: 'dialer' };
  openChat(room);
  setPeerState(room.online() ? t('connecting') : t('waitingFor', { name: room.label() }));
  startKnocking(c);
}
function startKnocking(c) {
  const started = Date.now();
  const knock = () => {
    if (call !== c) return;
    c.room.send({ t: 'knock' });
    if (c.room.kind === 'join' && !c.warned && Date.now() - started > 60000) {
      c.warned = true;
      addSystem(t('stillWaiting', { name: c.room.label() }));
    }
  };
  knock();
  c.knocker = setInterval(knock, 3000);
}

// Someone knocked: I make the WebRTC offer.
async function startOffer(room, peer) {
  endCall();
  const c = call = { room, role: 'offerer', peer };
  openChat(room);
  setPeerState(t('connecting'));
  c.pc = makePeerConnection(c);
  watchChannel(c, c.pc.createDataChannel('chat', { ordered: true }));
  await c.pc.setLocalDescription(await c.pc.createOffer());
  await waitForIce(c.pc);
  if (call !== c) return;
  room.send({ t: 'offer', to: peer, sdp: c.pc.localDescription.sdp });
  c.timer = setTimeout(() => {
    if (call === c && !session?.ready) connectionLost(c, t('couldntConnect'));
  }, 25000);
}

async function answerOffer(c, m) {
  clearInterval(c.knocker);
  c.peer = m.from;
  c.pc = makePeerConnection(c);
  c.pc.ondatachannel = (e) => watchChannel(c, e.channel);
  await c.pc.setRemoteDescription({ type: 'offer', sdp: m.sdp });
  await c.pc.setLocalDescription(await c.pc.createAnswer());
  await waitForIce(c.pc);
  if (call !== c) return;
  c.room.send({ t: 'answer', to: m.from, sdp: c.pc.localDescription.sdp });
  c.timer = setTimeout(() => {
    if (call !== c || session?.ready) return;
    try { c.pc.close(); } catch {}
    c.pc = null;
    startKnocking(c); // try again
  }, 25000);
}

function endCall() {
  const c = call;
  call = null; session = null;
  if (!c) return;
  clearInterval(c.knocker); clearTimeout(c.timer);
  try { c.pc?.close(); } catch {}
}

function connectionLost(c, text = t('disconnectedMsg')) {
  if (call !== c) return;
  endCall();
  addSystem(text, true);
  setChatEnabled(false);
  setPeerState(t('disconnected'));
}

// ---------- encrypted session over the direct link ----------
const HELLO_LABEL = enc.encode('peerchat-hello-v1');

function attachChannel(c, channel) {
  clearTimeout(c.timer);
  const s = { call: c, channel, ready: false, peer: null, sendKey: null, recvKey: null, sendCounter: 0, recvCounter: -1, safety: null, queue: Promise.resolve() };
  session = s;
  s.helloSent = sendHello(s);
  channel.onmessage = (e) => { s.queue = s.queue.then(() => onData(s, e.data)).catch((err) => fail(s, err)); };
  channel.onclose = () => { if (session === s) connectionLost(c); };
  setPeerState(t('securing'));
}

async function sendHello(s) {
  s.eph = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveBits']);
  s.ephRaw = new Uint8Array(await crypto.subtle.exportKey('raw', s.eph.publicKey));
  const sig = new Uint8Array(await crypto.subtle.sign(
    { name: 'ECDSA', hash: 'SHA-256' }, me.keys.privateKey, concat(HELLO_LABEL, s.ephRaw)));
  s.channel.send(JSON.stringify({ t: 'hello', name: me.name, id: b64u.enc(me.pubRaw), eph: b64u.enc(s.ephRaw), sig: b64u.enc(sig) }));
}

async function onData(s, raw) {
  if (session !== s) return;
  const m = JSON.parse(raw);
  if (m.t === 'hello' && !s.ready) return onHello(s, m);
  if (m.t === 'msg' && s.ready) return onMessage(s, m);
  throw new Error(t('errUnexpected'));
}

async function onHello(s, h) {
  await s.helloSent;
  const peerId = b64u.dec(h.id), peerEph = b64u.dec(h.eph);
  const idKey = await crypto.subtle.importKey('raw', peerId, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
  const ok = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, idKey, b64u.dec(h.sig), concat(HELLO_LABEL, peerEph));
  if (!ok) throw new Error(t('errSig'));
  if (compareBytes(peerId, me.pubRaw) === 0) throw new Error(t('errSelf'));

  const idStr = b64u.enc(peerId);
  const room = s.call.room;
  if (room.kind === 'contact' && room.contactId !== idStr) {
    throw new Error(t('errWrongDevice', { name: room.label() }));
  }

  // ECDH -> HKDF -> one AES-GCM key per direction.
  const peerEphKey = await crypto.subtle.importKey('raw', peerEph, { name: 'ECDH', namedCurve: 'P-256' }, false, []);
  const shared = await crypto.subtle.deriveBits({ name: 'ECDH', public: peerEphKey }, s.eph.privateKey, 256);
  const hkdfKey = await crypto.subtle.importKey('raw', shared, 'HKDF', false, ['deriveKey', 'deriveBits']);
  const iAmLow = compareBytes(s.ephRaw, peerEph) < 0;
  const salt = await sha256(iAmLow ? concat(s.ephRaw, peerEph) : concat(peerEph, s.ephRaw));
  const dirKey = (info, usage) => crypto.subtle.deriveKey(
    { name: 'HKDF', hash: 'SHA-256', salt, info: enc.encode(info) }, hkdfKey, { name: 'AES-GCM', length: 256 }, false, [usage]);
  s.sendKey = await dirKey(iAmLow ? 'peerchat low->high' : 'peerchat high->low', 'encrypt');
  s.recvKey = await dirKey(iAmLow ? 'peerchat high->low' : 'peerchat low->high', 'decrypt');
  s.eph = null;

  // Safety number from both identity keys (the same on both devices).
  const [a, b] = compareBytes(me.pubRaw, peerId) < 0 ? [me.pubRaw, peerId] : [peerId, me.pubRaw];
  const digest = await sha256(concat(enc.encode('peerchat-safety-v1'), a, b));
  const dv = new DataView(digest.buffer);
  s.safety = Array.from({ length: 6 }, (_, i) => String(dv.getUint32(i * 4) % 100000).padStart(5, '0'));

  // Save or update the contact.
  const isNew = !contacts[idStr];
  const old = contacts[idStr];
  let pairSecret = room.secret;
  if (room.kind !== 'contact') {
    // First connection through an invite link: move to a fresh private room that only these two
    // devices can work out (from this session's key exchange), so the link is now useless to anyone.
    const bits = await crypto.subtle.deriveBits(
      { name: 'HKDF', hash: 'SHA-256', salt, info: enc.encode('thepeer pair room v1') }, hkdfKey, 128);
    pairSecret = b64u.enc(new Uint8Array(bits));
    delete invites[room.secret]; delete joins[room.secret];
    room.close();
    await Promise.all([saveInvites(), saveJoins()]);
    if (currentView === 'v-invite') renderInviteIfNeeded();
  }
  if (old?.secret && old.secret !== pairSecret) roomsBySecret.get(old.secret)?.close();
  contacts[idStr] = { name: cleanName(h.name), verified: !!old?.verified, secret: pairSecret, lastSeen: Date.now() };
  await saveContacts();
  const pairRoom = await Room.open(pairSecret, 'contact', { contactId: idStr });
  pairRoom.lastSeen = Date.now();
  s.call.room = pairRoom;

  s.peer = { id: idStr, name: contacts[idStr].name };
  s.ready = true;
  onSecure(s, isNew);
}

async function onMessage(s, m) {
  if (!Number.isInteger(m.n) || m.n <= s.recvCounter) throw new Error(t('errReplay'));
  const iv = new Uint8Array(12);
  new DataView(iv.buffer).setUint32(8, m.n);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, s.recvKey, b64u.dec(m.c));
  s.recvCounter = m.n;
  const { text, ts } = JSON.parse(dec.decode(pt));
  addMessage(String(text), 'them', ts);
}

async function sendMessage(text) {
  const s = session;
  if (!s?.ready || s.channel.readyState !== 'open') return;
  const n = s.sendCounter++;
  const iv = new Uint8Array(12);
  new DataView(iv.buffer).setUint32(8, n); // unique per key, never reused
  const ts = Date.now();
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, s.sendKey, enc.encode(JSON.stringify({ text, ts }))));
  s.channel.send(JSON.stringify({ t: 'msg', n, c: b64u.enc(ct) }));
  addMessage(text, 'me', ts);
}

function fail(s, err) {
  if (session !== s) return;
  console.error(err);
  connectionLost(s.call, t('securityProblem', { msg: err.message }));
}

// ---------- invites ----------
function inviteLink(secret) {
  return `${location.origin}${location.pathname}#join=${secret}&n=${encodeURIComponent(me.name)}`;
}
let shownInvite = null;
async function showInvite() {
  // Reuse an unused invite so the link doesn't change every time.
  expireInvites();
  let secret = Object.keys(invites).sort((x, y) => invites[y].created - invites[x].created)[0];
  if (!secret) {
    secret = b64u.enc(randomBytes(16));
    invites[secret] = { created: Date.now() };
    await saveInvites();
  }
  await Room.open(secret, 'invite');
  shownInvite = secret;
  const link = inviteLink(secret);
  $('#invite-link').textContent = link;
  const qr = qrcode(0, 'M');
  qr.addData(link);
  qr.make();
  $('#invite-qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  show('v-invite');
}
function renderInviteIfNeeded() { if (shownInvite && !invites[shownInvite]) shownInvite = null; }

// Called when the app is opened through someone's invite link.
async function acceptInviteFromUrl() {
  const params = new URLSearchParams(location.hash.slice(1));
  const secret = params.get('join');
  if (!secret) return null;
  history.replaceState(null, '', location.pathname + location.search);
  try { if (b64u.dec(secret).length !== 16) return null; } catch { return null; }
  if (invites[secret]) return null; // my own link
  joins[secret] = { from: cleanName(params.get('n')), created: Date.now() };
  await saveJoins();
  return { secret, from: joins[secret].from };
}
async function startJoin(j) {
  dial(await Room.open(j.secret, 'join', { from: j.from }));
}

// ---------- UI ----------
function updateNetStatus() {
  const up = relay.upCount();
  $('#net-dot').className = 'dot ' + (up ? 'on' : 'bad');
  $('#net-text').textContent = up ? t('ready') : t('offlineNet');
}

function contactRooms() {
  return Object.entries(contacts)
    .map(([id, c]) => ({ id, c, room: roomsBySecret.get(c.secret) }))
    .filter((x) => x.room);
}
function refreshPresence() {
  if (currentView === 'v-home') renderContacts();
  if (call) $('#peer-dot').className = 'dot' + (call.room.online() || session?.ready ? ' on' : '');
}
function renderContacts() {
  const box = $('#contacts');
  box.innerHTML = '';
  const list = contactRooms().sort((x, y) => (y.room.online() - x.room.online()) || (y.c.lastSeen - x.c.lastSeen));
  const pending = Object.entries(joins);
  if (!list.length && !pending.length) {
    box.innerHTML = `<div class="empty">${t('noChats')}</div>`; // fixed text from STRINGS, never user input
    return;
  }
  for (const { c, room } of list) {
    const btn = document.createElement('button');
    btn.className = 'contact';
    const av = document.createElement('div'); av.className = 'avatar';
    av.textContent = (c.name[0] || '?').toUpperCase();
    const dot = document.createElement('span'); dot.className = 'dot' + (room.online() ? ' on' : ''); av.append(dot);
    const who = document.createElement('div'); who.className = 'who';
    const b = document.createElement('b'); b.textContent = c.name + (c.verified ? ' ✓' : '');
    const sp = document.createElement('span'); sp.textContent = room.online() ? t('online') : t('offline');
    who.append(b, sp);
    btn.append(av, who);
    btn.onclick = () => dial(room);
    box.append(btn);
  }
  for (const [secret, j] of pending) {
    const btn = document.createElement('button');
    btn.className = 'contact';
    const who = document.createElement('div'); who.className = 'who';
    const b = document.createElement('b'); b.textContent = j.from;
    const sp = document.createElement('span'); sp.textContent = t('pendingInvite');
    who.append(b, sp);
    btn.append(who);
    btn.onclick = () => startJoin({ secret, from: j.from });
    box.append(btn);
  }
}

function openChat(room) {
  show('v-chat');
  $('#messages').innerHTML = '';
  const name = room.label();
  $('#peer-name').textContent = name;
  $('#peer-initial').textContent = (name[0] || '?').toUpperCase();
  $('#peer-dot').className = 'dot' + (room.online() ? ' on' : '');
  $('#verify-btn').disabled = true;
  setChatEnabled(false);
}
function setPeerState(text, cls = '') { const el = $('#peer-state'); el.textContent = text; el.className = cls; }
function setChatEnabled(on) {
  $('#msg-input').disabled = !on; $('#send-btn').disabled = !on;
  if (on) $('#msg-input').focus();
}
function updateSecureState(s) {
  if (s.peer.verified || contacts[s.peer.id]?.verified) setPeerState(t('encVerified'), 'ok');
  else setPeerState(t('encNotVerified'), 'warn');
}
function onSecure(s, isNew) {
  $('#peer-name').textContent = s.peer.name;
  $('#peer-initial').textContent = (s.peer.name[0] || '?').toUpperCase();
  $('#peer-dot').className = 'dot on';
  $('#verify-btn').disabled = false;
  updateSecureState(s);
  addSystem(isNew
    ? t('connectedNew', { name: s.peer.name })
    : t('connected', { name: s.peer.name }));
  setChatEnabled(true);
}
function addMessage(text, who, ts) {
  const box = $('#messages');
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  const tm = document.createElement('time');
  tm.textContent = new Date(ts).toLocaleTimeString(lang, { hour: '2-digit', minute: '2-digit' });
  div.append(tm);
  box.append(div);
  box.scrollTop = box.scrollHeight;
}
function addSystem(text, isErr = false) {
  const div = document.createElement('div');
  div.className = 'sys' + (isErr ? ' err' : '');
  div.textContent = text;
  $('#messages').append(div);
  $('#messages').scrollTop = $('#messages').scrollHeight;
}
function goHome() {
  endCall();
  $('#hello').textContent = t('hi', { name: me.name });
  updateNetStatus();
  renderContacts();
  show('v-home');
}

// ---------- wire up ----------
let pendingJoin = null;
$('#setup-btn').onclick = async () => {
  const name = $('#name-input').value.trim();
  if (!name) return $('#name-input').focus();
  $('#setup-btn').disabled = true;
  await createIdentity(name);
  goHome();
  if (pendingJoin) startJoin(pendingJoin);
};
$('#name-input').onkeydown = (e) => { if (e.key === 'Enter') $('#setup-btn').click(); };
$('#go-invite').onclick = showInvite;
document.querySelectorAll('[data-lang-toggle]').forEach((b) => (b.onclick = switchLanguage));
applyLanguage();
document.querySelectorAll('[data-home]').forEach((b) => (b.onclick = goHome));
$('#invite-copy').onclick = (e) => copyText($('#invite-link').textContent, e.target);
$('#invite-share').onclick = async (e) => {
  const url = $('#invite-link').textContent;
  if (navigator.share) {
    try { await navigator.share({ title: 'The Peer', text: t('shareText', { name: me.name }), url }); } catch { /* cancelled */ }
  } else copyText(url, e.target);
};
$('#leave-btn').onclick = goHome;
$('#send-btn').onclick = () => {
  const text = $('#msg-input').value.trim();
  if (!text) return;
  $('#msg-input').value = '';
  sendMessage(text);
};
$('#msg-input').onkeydown = (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#send-btn').click(); }
};
$('#verify-btn').onclick = () => {
  if (!session?.safety) return;
  $('#verify-title').textContent = t('verifyTitle', { name: session.peer.name });
  $('#safety').innerHTML = '';
  for (const g of session.safety) { const d = document.createElement('div'); d.textContent = g; $('#safety').append(d); }
  $('#verify-dlg').showModal();
};
$('#verify-close').onclick = () => $('#verify-dlg').close();
$('#verify-ok').onclick = async () => {
  const s = session;
  $('#verify-dlg').close();
  if (!s?.peer || !contacts[s.peer.id]) return;
  s.peer.verified = true;
  contacts[s.peer.id].verified = true;
  await saveContacts();
  updateSecureState(s);
  addSystem(t('youVerified', { name: s.peer.name }));
};
window.addEventListener('hashchange', async () => {
  const j = await acceptInviteFromUrl();
  if (j && me) startJoin(j);
});

// Tell friends we're here, so they see us as online.
setInterval(() => {
  if (document.visibilityState !== 'visible') return;
  expireInvites();
  for (const { room } of contactRooms()) room.send({ t: 'here' });
  refreshPresence();
}, PRESENCE_EVERY);

(async () => {
  if (!window.RTCPeerConnection || !crypto.subtle || !window.WebSocket) {
    document.body.innerHTML = `<p style="padding:24px">${t('oldBrowser')}</p>`;
    return;
  }
  await loadState();
  relay.start();
  await Promise.all([
    ...Object.values(contacts).map((c) => Room.open(c.secret, 'contact')),
    ...Object.keys(invites).map((s) => Room.open(s, 'invite')),
  ]);
  for (const [id, c] of Object.entries(contacts)) roomsBySecret.get(c.secret).contactId = id;
  for (const [s, j] of Object.entries(joins)) await Room.open(s, 'join', { from: j.from });

  pendingJoin = await acceptInviteFromUrl();
  if (!me) {
    if (pendingJoin) {
      $('#invited-banner').hidden = false;
      $('#invited-title').textContent = t('invitedTitle', { name: pendingJoin.from });
      $('#setup-intro').hidden = true;
    }
    show('v-setup');
    $('#name-input').focus();
    return;
  }
  goHome();
  if (pendingJoin) startJoin(pendingJoin);
})();
</script>
</body>
</html>
